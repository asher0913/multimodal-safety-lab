[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-safety-lab"
version = "1.0.0"
description = "Content-free red-team benchmark for text + image (OCR) input guards: cross-modal splitting, confusables, zero-width, leetspeak and OCR-noise evasions against benign lookalikes, with per-family attack-success and false-refusal rates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yixuan Zhang"}]
dependencies = []

[project.optional-dependencies]
viz = ["matplotlib>=3.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mmsafety = "mmsafety.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
